[project]
name = "liorium-realm-base"
version = "0.1.0"
description = "Liorium realm 契约与写作 API：Realm / BaseRealm / RealmContext / 状态 store / @realm_tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "liwusen" }]
keywords = ["agent", "llm", "langgraph", "realm", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "liorium-core",
    # realm 状态用 vfs 的读写锁；挂载类型（VfsMount / VirtualFileSystem）在 vfs 里。
    "liorium-vfs",
]

[project.optional-dependencies]
# 只有「用 @realm_tool 提供工具」的 realm 才需要：本包 import 期不碰 langchain。
tools = ["langchain-core>=1.6,<1.7"]

[tool.uv.sources]
liorium-core = { workspace = true }
liorium-vfs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 命名空间包：src/liorium 下没有 __init__.py，必须用 only-include + sources
# 让 wheel 里是 liorium/realm_base/... 而不是 realm_base/...
only-include = ["src/liorium"]
sources = ["src"]

[project.urls]
Homepage = "https://github.com/liwusen/liorium-framework"
Repository = "https://github.com/liwusen/liorium-framework"
Documentation = "https://github.com/liwusen/liorium-framework/tree/main/docs"
Changelog = "https://github.com/liwusen/liorium-framework/releases"
Issues = "https://github.com/liwusen/liorium-framework/issues"
