[project]
name = "liorium-memory"
version = "0.1.1"
description = "Liorium 记忆能力包：SQLite 存储（v1 schema）+ 混合检索 + 实体图谱 + MemoryRealm"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "liwusen" }]
keywords = ["agent", "llm", "langgraph", "realm", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "liorium-core",
    # 挂载树要返回 VfsMount（计划 §3.3），所以能力包用 vfs 的公开面；
    # 允许 import liorium.agent（2026-11-06 起），本包当前未使用。
    "liorium-vfs",
    "langchain-core>=1.6,<1.7",
]

[project.optional-dependencies]
# 语义检索（P1）。**默认不装**：纯关键词（SQLite FTS5）零额外依赖就能用；
# 装上之后 ``NanoVectorBackend`` 写出的 ``index/chunks.vdb`` 与 v1
# 的同名文件格式一致（同 dim / 同 metadata 键 / 同 cosine 归一化）。
vector = [
    # pin 到 0.0.4.3：nano 的落盘格式没有版本号，升级可能改 ``matrix`` 编码。
    "nano-vectordb==0.0.4.3",
    "numpy>=2",
    "httpx>=0.27",
]

[tool.uv.sources]
liorium-core = { workspace = true }
liorium-vfs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 命名空间包：src/liorium 下没有 __init__.py，必须用 only-include + sources
# 让 wheel 里是 liorium/memory/... 而不是 memory/...
only-include = ["src/liorium"]
sources = ["src"]

[project.urls]
Homepage = "https://github.com/liwusen/liorium-framework"
Repository = "https://github.com/liwusen/liorium-framework"
Documentation = "https://github.com/liwusen/liorium-framework/tree/main/docs"
Changelog = "https://github.com/liwusen/liorium-framework/releases"
Issues = "https://github.com/liwusen/liorium-framework/issues"
