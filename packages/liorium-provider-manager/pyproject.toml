[project]
name = "liorium-provider-manager"
version = "0.1.1"
description = "Liorium LLM Provider 管理：配置 schema、四种 API 格式、思考能力、models.dev 目录"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "liwusen" }]
keywords = ["agent", "llm", "langgraph", "realm", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "liorium-core",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "langchain-core>=1.6,<1.7",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.6,<2"]
anthropic = ["langchain-anthropic>=1.7,<2"]
google = ["langchain-google-genai>=4.4,<5"]
all = [
    "langchain-openai>=1.6,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-google-genai>=4.4,<5",
]

[tool.uv.sources]
liorium-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 命名空间包：src/liorium 下没有 __init__.py，必须用 only-include + sources
# 让 wheel 里是 liorium/provider/... 而不是 provider/...
only-include = ["src/liorium"]
sources = ["src"]

[project.urls]
Homepage = "https://github.com/liwusen/liorium-framework"
Repository = "https://github.com/liwusen/liorium-framework"
Documentation = "https://github.com/liwusen/liorium-framework/tree/main/docs"
Changelog = "https://github.com/liwusen/liorium-framework/releases"
Issues = "https://github.com/liwusen/liorium-framework/issues"
