name: Publish to PyPI

# Trusted Publishing（OIDC）：仓库里没有任何 PyPI token / secret。
#
# 发布单元只有一个发行版 liorium —— 12 个模块（core / vfs / realm_base / core_tool /
# core_tool_realm / agent / memory / skills / mcp / todo_realm / provider / cli）的源码由
# 根 pyproject.toml 的 force-include 打进同一个 wheel。因此 PyPI 侧只需要**一条**配置：
#
#   PyPI Project Name: liorium
#   Owner:            liwusen
#   Repository name:  liorium-framework
#   Workflow name:    publish.yml
#   Environment name: pypi      （TestPyPI 用 testpypi）
#
# 历史提醒：以前是 12 个包各自发布，而 PyPI 对 GitHub publisher 的唯一性约束是
# (owner, repo, workflow, environment) 四元组全局唯一，所以 12 个包必须挤在 12 个不同的
# environment 里。改成单一发行版后这个约束不再是问题。
# 详见 docs/PUBLISHING.md。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "发布到哪个索引（build-only 只构建，不发布，用于配 PyPI 前演练）"
        type: choice
        required: true
        default: pypi
        options: [pypi, testpypi, build-only]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. 构建：一个 sdist + 一个 wheel（内含 12 个模块）
  # ---------------------------------------------------------------------------
  build:
    name: build liorium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Check tag matches the distribution version
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run --no-project python scripts/check_version.py "${{ github.ref_name }}" --all

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - name: Verify the distribution metadata
        run: uv run --no-project --with twine twine check --strict dist/*

      - name: Verify the wheel ships all 12 modules
        run: uv run --no-project python scripts/check_wheel.py dist/*.whl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. 发布：OIDC 换取 PyPI 的短期凭证（environment 名字必须与 PyPI 里填的一致）
  # ---------------------------------------------------------------------------
  publish:
    name: publish liorium
    needs: build
    # build-only：只验证能构建 + 元数据合法 + 12 个模块齐全，不碰 PyPI
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'build-only'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
    permissions:
      id-token: write # OIDC：Trusted Publishing 必需
      contents: read
    steps:
      - name: Download the built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish liorium
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          attestations: true
          print-hash: true
          # 允许重跑：同版本已存在时跳过，而不是让整个 release 变红
          skip-existing: true

  # ---------------------------------------------------------------------------
  # 3. 收尾：给 GitHub Release 附上产物
  # ---------------------------------------------------------------------------
  release:
    name: attach distributions to the GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
